<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouwsteen — editor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="editor-shell">
    <div class="editor-topbar">
      <div style="display:flex; align-items:center; gap:16px;">
        <a href="index.html" class="btn btn-ghost" style="padding:8px 14px;">← Mijn websites</a>
        <input class="site-name" id="site-name" value="Mijn website">
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="save-status" id="save-status">Alles opgeslagen</span>
        <button class="btn btn-primary" id="preview-btn">Bekijk website</button>
      </div>
    </div>

    <aside class="panel panel-left">
      <h3>Blokken</h3>
      <div id="block-library"></div>
    </aside>

    <main class="canvas-wrap">
      <div id="canvas"></div>
    </main>

    <aside class="panel panel-right" id="style-panel">
      <!-- wordt gevuld door editor.js -->
    </aside>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
